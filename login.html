<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LOGIN PAGE</title>
    <LINK rel="stylesheet" href="login.css">
        <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
</head>
<body>  
    <header class="top-navbar">
        <!-- left:company identity -->
         <div class="nav-brand">
            <img src="images/logo.webp" alt="Logo de l'entreprise" class="brand-logo">
            <span class="brand-short">SNTP</span>
            <div class="brand-divider"> </div>
            <div class="brand-full">
                Société Nationale<br>
                 des Travaux Publics</div>        
         
        </div>
        <!-- right: navigation -->
         <nav class="nav-links">
            <a href="#"class="nav-link">
                <i class="fa-solid fa-house"></i>
                Accueil
            </a>
            <a href="#" class="nav-link">
                <i class="fa-solid fa-info-circle"></i>
                A propos
            </a>
            
        </nav>
    </header>

    <div class="company-info">
        <div class="burgundy-line"></div>

         <p class="welcome">Bienvenue sur l’espace</p>

         <h1 class="sntp-title">SNTP</h1>

         <p class="description">
           Votre partenaire dans la réalisation
           <br>
           des grands projets d’infrastructure
         </p>
    </div>
    
    <div class="login-container">
        <div class="profile-icon">
            <i class="fa-solid fa-user"></i>
        </div>
        <h2>Se Connecter</h2>
         <p>acceder à votre compte</p>
         <form>
            <label>identifiant</label>
              <i class="fa-solid fa-user"></i>
               <input type="text" placeholder="Entrez votre identifiant" >
            <label>mot de passe</label>
             <i class="fa-solid fa-lock"></i>
             <div class="input-box">
            
              <input type="password" placeholder="Entrez votre mot de passe" id="password">
              <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>
            <button type="submit">
            <i class="fa-solid fa-door-open"></i>
            Se Connecter
            </button>
         </form>
    </div>
    <footer class="footer.footer">
        <p>&copy; 2026 Société Nationale des Travaux Publics.</p>
    </footer>     

</body>
</html>
